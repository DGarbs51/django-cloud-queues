[project]
name = "django-cloud-queues"
version = "0.0.0"
description = "Django app that checks whether Django works on a Laravel Cloud deployment with managed queues."
requires-python = ">=3.11"
dependencies = [
    # 5.2 LTS: Django 6 needs Python 3.12+, and every environment runs the same Django.
    "django>=5.2,<6",
    "dj-database-url>=3.1.2",
    "laravel-cloud-queues[redis]>=0.5.0",
    # Django's MySQL backend through PyMySQL (config/settings.py): mysqlclient has no Linux wheels.
    "pymysql",
    "certifi",
    "gunicorn",
    "uvicorn[standard]",
    "laravel-cloud-logging==0.4.0",
    "psycopg[binary]>=3.3.6",
    "websockets>=16.1.1",
    "granian>=2.8.4",
    "hypercorn[uvloop]>=0.18.0",
    "daphne>=4.2.3",
    "waitress>=3.0.2",
    "pyuwsgi>=2.0.30.post1",
    "psycopg-pool>=3.3.3",
    "asyncmy>=0.2.16",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

# The worker Cloud runs for a managed queue (`laravel-cloud-queues work --queue=default`) passes no target.
# demo.jobs calls django.setup(), so jobs can use the ORM and settings.
[tool.laravel-cloud-queues]
target = "demo.jobs:registry"
